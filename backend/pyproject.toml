[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eat-what-backend"
version = "0.1.0"
description = "今天吃啥 后端 API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "Estevan233" }]

dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.27,<0.32",
    "sqlmodel>=0.0.22,<0.1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<0.30",
    "structlog>=24.1,<26",
    "lunar-python>=1.3.0,<2",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.0,<4.1",
    "pyjwt>=2.8,<3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=4.0,<6",
    "ruff>=0.3,<0.9",
    "mypy>=1.9,<2",
    "types-passlib",
]

[project.scripts]
eat-what = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "RUF",                # ruff-specific
    "C90",                # mccabe complexity
]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]  # 中文全角标点不算 ambiguous；FastAPI Depends() 在默认值是官方写法

# 数据校验脚本分支多，复杂度放宽（C90 默认阈值 10）
[tool.ruff.lint.per-file-ignores]
"scripts/validate_food_seed.py" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
